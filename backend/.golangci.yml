run:
  timeout: 3m
  go: "1.25"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    # Tests often have unused parameters and loose error handling by design.
    - path: _test\.go
      linters:
        - errcheck
        - revive
    # Migrations and DB setup tolerate raw SQL in a few places.
    - path: internal/repository
      linters:
        - errcheck
